# A project translates into one executable or library.
project:

  groups:
    - group: Source Files
      files:
        - file: ./main.c
        - file: stdout_user.c
        - file: Blinky.c
        - file: vio.c

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: ARM::CMSIS:CORE
    - component: Device:Startup
    - component: CMSIS Driver:GPIO&Release
    - component: MCHP-PLIB:PORT&Release
    - component: MCHP-PLIB:OSCCTRL&Release
    - component: MCHP-PLIB:System Interrupt&Release
    - component: MCHP-PLIB:GCLK&Release
    - component: MCHP-PLIB:SERCOM:SERCOM_USART1&Release
    - component: MCHP-PLIB:MCLK&Release
    - component: CMSIS Driver:USART:USART1&Release
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Library
    - component: CMSIS-Compiler:CORE
    - component: CMSIS-Compiler:STDOUT:Custom
    - component: CMSIS Driver:VIO:Custom

  # List executable file formats to be generated.
  output:
    type:
      - elf
      - hex
      - map
  packs:
    - pack: ARM::CMSIS-RTX
    - pack: ARM::CMSIS-Compiler
